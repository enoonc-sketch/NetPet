<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
  :root { --ink:#4A3B47; --mute:#8C7F8A; --line:#ECE6F2; --down:#3FBF9B; --up:#8E76E8; --peach:#FFC9A8; }
  * { box-sizing:border-box; margin:0; padding:0; user-select:none; }
  html, body { background:transparent; overflow:hidden; }
  body { font-family:"Microsoft YaHei UI","PingFang SC",system-ui,sans-serif; color:var(--ink); font-size:13px; padding:4px; }
  .card { background:#fff; border-radius:18px; padding:12px 14px; box-shadow:0 4px 18px rgba(74,59,71,.22); }
  .row { display:flex; justify-content:space-between; align-items:baseline; }
  .big { font-size:19px; font-weight:800; } .d { color:var(--down); } .u { color:var(--up); } .mute { color:var(--mute); font-size:11px; }
  canvas { width:100%; height:56px; display:block; margin:6px 0; }
  .bar { height:7px; background:var(--line); border-radius:99px; overflow:hidden; margin:3px 0 7px; } .bar i { display:block; height:100%; background:var(--up); }
  .st { display:inline-block; background:#FFF3EA; border-radius:99px; padding:2px 9px; font-size:11px; }
  button { margin-top:8px; width:100%; border:0; background:var(--peach); color:var(--ink); border-radius:12px; padding:7px; font:inherit; font-weight:700; cursor:pointer; }
</style>
</head>
<body>
<div class="card">
  <div class="row"><span class="st" id="st">待机</span><span class="mute" id="net"></span></div>
  <div class="row" style="margin-top:6px"><span class="big d" id="rx">↓ —</span><span class="big u" id="tx">↑ —</span></div>
  <canvas id="ch"></canvas>
  <div class="row"><span>CPU</span><span id="cpu">—</span></div><div class="bar"><i id="cpub" style="width:0"></i></div>
  <div class="row"><span>内存</span><span id="mem">—</span></div><div class="bar"><i id="memb" style="width:0"></i></div>
  <div id="disks"></div>
  <div class="mute" id="misc"></div>
  <button id="open">打开完整窗口</button>
</div>
<script>
  const $ = (s) => document.querySelector(s), api = window.netpet.invoke;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const fmt = (b) => b == null ? '—' : b < 1024 ? Math.round(b)+' B/s' : b < 1048576 ? (b/1024).toFixed(0)+' KB/s' : (b/1048576).toFixed(1)+' MB/s';
  const sz = (b) => b < 1073741824 ? (b/1048576).toFixed(0)+' MB' : (b/1073741824).toFixed(1)+' GB';
  const NAME = { IDLE:'待机', HAPPY:'开心', SLEEP:'睡觉', TIRED:'累了', HOT:'发热', SWEAT:'内存紧张', WARNING:'有提醒', DOWNLOAD:'下载中', UPLOAD:'上传中' };
  let hx = Array(60).fill(0), ht = Array(60).fill(0);
  function draw() {
    const c = $('#ch'), r = devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight; c.width = w * r; c.height = h * r;
    const x = c.getContext('2d'); x.scale(r, r); const max = Math.max(1024, ...hx, ...ht) * 1.15;
    const line = (a, col) => { x.beginPath(); a.forEach((v, i) => { const px = i / 59 * w, py = h - v / max * (h - 4) - 2; i ? x.lineTo(px, py) : x.moveTo(px, py); }); x.strokeStyle = col; x.lineWidth = 2; x.stroke(); };
    line(hx, '#3FBF9B'); line(ht, '#8E76E8');
  }
  window.netpet.on('speed', ({ rx, tx, online }) => {
    hx.push(rx || 0); hx.shift(); ht.push(tx || 0); ht.shift();
    $('#rx').textContent = '↓ ' + fmt(rx); $('#tx').textContent = '↑ ' + fmt(tx);
    $('#net').textContent = online === false ? '网络已断开' : rx == null ? '网速监控未开启' : '';
    draw();
  });
  window.netpet.on('pstate', (s) => { $('#st').textContent = s.paused ? '已暂停' : NAME[s.state] || s.state; });
  window.netpet.on('sample', (s) => {
    $('#cpu').textContent = s.cpu.toFixed(0) + '%'; $('#cpub').style.width = s.cpu + '%';
    $('#mem').textContent = s.pct.toFixed(0) + '%（' + sz(s.used) + '）'; $('#memb').style.width = s.pct + '%';
    if (s.temp) $('#misc').dataset.t = s.temp.toFixed(0);
  });
  async function sys() {
    try {
      const s = await api('get-system');
      if (!s.hwOn) { $('#cpu').textContent = '未开启'; $('#mem').textContent = '未开启'; $('#disks').innerHTML = ''; $('#misc').textContent = '硬件状态监控已关闭（可在完整窗口 → 隐私 开启）'; return; }
      $('#disks').innerHTML = (s.disks || []).slice(0, 2).map((d) => `<div class="row"><span>${esc(d.mount)}</span><span class="mute">${sz(d.used)} / ${sz(d.size)}</span></div><div class="bar"><i style="width:${d.pct}%"></i></div>`).join('');
      const g = (s.gpu || [])[0], parts = [];
      parts.push('GPU：' + (g ? esc(g.name) + (g.util != null ? ' ' + g.util + '%' : '（无法读取占用）') : '无法检测'));
      parts.push('温度：' + (s.temp ? s.temp.toFixed(0) + '℃' : '读不到'));
      if (s.battery) parts.push('电量：' + s.battery.pct + '%' + (s.battery.charging ? '（充电中）' : ''));
      $('#misc').innerHTML = parts.join('<br>');
    } catch (_) {}
  }
  $('#open').onclick = () => window.netpet.send('panel-open-main');
  window.addEventListener('focus', sys); sys(); setInterval(() => { if (!document.hidden) sys(); }, 10000);
</script>
</body>
</html>
