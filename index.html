<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>NetPet</title>
<style>
  :root { --body:#FFC9A8; --ear:#FFB48A; --belly:#FFF1E3; --ink:#4A3B47; --down:#3FBF9B; --up:#8E76E8; }
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
  html, body { width:100%; height:100%; background:transparent; overflow:hidden; }
  body { font-family:"Microsoft YaHei UI","PingFang SC",system-ui,sans-serif; }
  .d { color:var(--down); } .u { color:var(--up); }
  .pet { position:absolute; bottom:6px; left:50%; width:72px; height:64px; margin-left:-36px; transform-origin:50% 100%; cursor:grab; }
  .pet:active { cursor:grabbing; }
  #c3d { position:absolute; bottom:2px; left:50%; margin-left:-38px; width:76px; height:76px; cursor:grab; display:none; }
    .has3d #c3d { display:block; } .has3d .pet { display:none; }
  .pet svg { width:100%; height:100%; overflow:visible; }
  .b { fill:var(--body); } .e { fill:var(--ear); } .belly { fill:var(--belly); }
  .tailp { stroke:var(--ear); }
  .eyes-open, .eyes-happy, .eyes-sleep, .zzz, .sweat, .sign { display:none; }
  .pet.idle .eyes-open, .pet.risk .eyes-open { display:block; }
  .pet.sleep .eyes-sleep, .pet.sleep .zzz { display:block; }
  .pet.happy .eyes-happy, .pet.rush .eyes-happy { display:block; }
  .pet.rush .sweat, .pet.hot .sweat { display:block; }
  .pet.risk .sign { display:block; }
  .pet.risk .eyes-sleep, .pet.risk .eyes-happy, .pet.risk .zzz { display:none; }
  .pet.idle { animation:breathe 3.2s ease-in-out infinite; }
  .pet.sleep { animation:breathe 5s ease-in-out infinite; }
  .pet.happy { animation:hop 1.1s ease-in-out infinite; }
  .pet.rush { animation:hop .45s ease-in-out infinite; }
  .pet.risk { animation:shake .5s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform:scale(1,1); } 50% { transform:scale(1.03,.97); } }
  @keyframes hop { 0%,100% { transform:translateY(0) scale(1.04,.94); } 50% { transform:translateY(-9px) scale(.97,1.04); } }
  @keyframes shake { 0%,100% { transform:rotate(-2deg); } 50% { transform:rotate(2deg); } }
  .zzz text { animation:float 2.4s ease-in-out infinite; }
  @keyframes float { 0% { opacity:0; transform:translateY(6px); } 50% { opacity:1; } 100% { opacity:0; transform:translateY(-8px); } }
  .tail { transform-origin:82px 62px; animation:wag 1.6s ease-in-out infinite; }
  .pet.rush .tail { animation-duration:.3s; } .pet.sleep .tail { animation:none; }
  @keyframes wag { 0%,100% { transform:rotate(-8deg); } 50% { transform:rotate(14deg); } }
  @media (prefers-reduced-motion:reduce) { .pet, .tail, .zzz text { animation:none !important; } }
</style>
</head>
<body>
  <canvas id="c3d"></canvas>
  <div class="pet sleep" id="pet">
    <svg viewBox="0 0 96 84">
      <path class="tail tailp" d="M80 64 q18 -4 12 -22" fill="none" stroke-width="8" stroke-linecap="round"/>
      <polygon class="e" points="18,30 22,6 40,22"/><polygon class="e" points="78,30 74,6 56,22"/>
      <polygon points="23,24 25,13 33,21" fill="#FF8FA3"/><polygon points="73,24 71,13 63,21" fill="#FF8FA3"/>
      <ellipse class="b" cx="48" cy="52" rx="40" ry="30"/>
      <ellipse class="belly" cx="48" cy="62" rx="22" ry="15"/>
      <ellipse cx="22" cy="56" rx="7" ry="4.5" fill="#FF8FA3" opacity=".55"/><ellipse cx="74" cy="56" rx="7" ry="4.5" fill="#FF8FA3" opacity=".55"/>
      <g class="eyes-open" fill="#4A3B47"><ellipse cx="34" cy="48" rx="4" ry="5"/><ellipse cx="62" cy="48" rx="4" ry="5"/>
        <circle cx="35.5" cy="46" r="1.4" fill="#fff"/><circle cx="63.5" cy="46" r="1.4" fill="#fff"/></g>
      <g class="eyes-happy" fill="none" stroke="#4A3B47" stroke-width="3" stroke-linecap="round"><path d="M29 51 q5 -9 10 0"/><path d="M57 51 q5 -9 10 0"/></g>
      <g class="eyes-sleep" fill="none" stroke="#4A3B47" stroke-width="3" stroke-linecap="round"><path d="M29 49 q5 5 10 0"/><path d="M57 49 q5 5 10 0"/></g>
      <path d="M43 58 q5 5 10 0" fill="none" stroke="#4A3B47" stroke-width="2.4" stroke-linecap="round"/>
      <g class="zzz" fill="#8E76E8" font-weight="700" font-size="11"><text x="74" y="22">z</text><text x="82" y="12" font-size="9">z</text></g>
      <g class="sweat"><path d="M80 34 q-4 7 0 9 q4 -2 0 -9z" fill="#7CC8FF"/></g>
      <g class="sign"><polygon points="48,0 60,20 36,20" fill="#FFC857" stroke="#4A3B47" stroke-width="2" stroke-linejoin="round"/>
        <text x="48" y="17" text-anchor="middle" font-size="13" font-weight="800" fill="#4A3B47">!</text></g>
    </svg>
  </div>
<script src="pets.bundle.js"></script>
<script>
  const pet = document.getElementById('pet'), c3d = document.getElementById('c3d');
  // 80x80 宠物窗口不再放速度气泡：网速仍在托盘悬停提示、单击小面板、完整窗口里显示
  // 状态由主进程的“宠物状态机”决定（带防抖和优先级），这里只负责表现
  const MAP = { SLEEP:['sleep'], IDLE:['idle'], HAPPY:['happy'], DOWNLOAD:['happy'], UPLOAD:['happy'], TIRED:['tired'], HOT:['idle','hot'], SWEAT:['idle','hot'], WARNING:['idle','risk'] };
  let ps = { state:'IDLE', label:'', paused:false }, p3d = null;
  function render() {
    const [mood, flag] = MAP[ps.state] || MAP.IDLE, m = ps.paused ? 'sleep' : mood, hot = flag === 'hot', risk = flag === 'risk';
    pet.className = 'pet ' + (m === 'tired' ? 'idle' : m) + (hot ? ' hot' : '') + (risk ? ' risk' : '');
    if (p3d) p3d.setState(m, hot, risk);
  }
  // 3D 宠物；如果显卡/WebGL 不可用，自动退回到 2D 小猫
  try { p3d = new NetPet3D.Pet3D(c3d, 'cat', { w: 76, h: 76 }); document.body.classList.add('has3d'); } catch (e) { p3d = null; }
  render();
  window.netpet.on('pstate', (s) => { ps = s; render(); });
  window.netpet.on('settings', ({ pet: id }) => { if (p3d && id) p3d.setPet(id); });
  // 拖动 / 单击(展开小面板) / 双击(打开完整窗口)
  let drag = null, clickT = null;
  const onDown = (e) => { if (e.button !== 0) return; drag = { sx:e.screenX, sy:e.screenY, moved:false }; window.netpet.send('drag-start'); };
  pet.addEventListener('mousedown', onDown); c3d.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', (e) => {
    if (!drag) return;
    const dx = e.screenX - drag.sx, dy = e.screenY - drag.sy;
    if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
    if (drag.moved) window.netpet.send('drag-move', { dx, dy });
  });
  window.addEventListener('mouseup', () => {
    if (drag) {
      if (drag.moved) window.netpet.send('drag-end');
      else if (clickT) { clearTimeout(clickT); clickT = null; window.netpet.send('pet-dblclick'); }
      else clickT = setTimeout(() => { clickT = null; window.netpet.send('pet-click'); }, 260);
    }
    drag = null;
  });
  window.addEventListener('contextmenu', (e) => { e.preventDefault(); window.netpet.send('pet-menu'); });
</script>
</body>
</html>
